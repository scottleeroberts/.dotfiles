[colors]
draw_bold_text_with_bright_colors = false

[colors.bright]
black = "0x6e6a86"
blue = "0x9ccfd8"
cyan = "0xebbcba"
green = "0x31748f"
magenta = "0xc4a7e7"
red = "0xeb6f92"
white = "0xe0def4"
yellow = "0xf6c177"

[colors.cursor]
cursor = "#f6c177"
text = "#1d1917"

[colors.hints.end]
background = "#1f1d2e"
foreground = "#6e6a86"

[colors.hints.start]
background = "#1f1d2e"
foreground = "#908caa"

[colors.line_indicator]
background = "None"
foreground = "None"

[colors.normal]
black = "0x26233a"
blue = "0x9ccfd8"
cyan = "0xebbcba"
green = "0x31748f"
magenta = "0xc4a7e7"
red = "0xeb6f92"
white = "0xe0def4"
yellow = "0xf6c177"

[colors.primary]
# background = "#0a0a0a"
background = "#171412"
foreground = "#e0def4"

[colors.search.matches]
foreground = "#1d1917"
background = "#908caa"

[colors.search.focused_match]
foreground = "#1d1917"
background = "#f6c177"

[colors.footer_bar]
foreground = "#e0def4"
background = "#26233a"

[colors.selection]
background = "0x403d52"
text = "0xe0def4"

[colors.vi_mode_cursor]
cursor = "#c4a7e7"
text = "#1d1917"

[bell]
animation = "EaseOutExpo"
duration = 120
color = "#f6c177"

[env]
TERM = "xterm-256color"

[font]
size = 18.0

[font.offset]
y = -5
# x = -1

[font.normal]
# family = "SeriousShanns Nerd Font Mono"
# family = "Monaco"
# family = "Recursive Mono Linear Static"
family = "Lilex Nerd Font Mono"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Quit"
key = "Q"
mods = "Command"

[[keyboard.bindings]]
action = "Quit"
key = "W"
mods = "Command"

[mouse]
hide_when_typing = true

[cursor]
style = { shape = "Beam", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "Off" }
blink_interval = 550
blink_timeout = 5
unfocused_hollow = true

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

[window]
opacity = 1.0
dynamic_padding = true

# [window.dimensions]
# columns = 80
# lines = 24

[window.padding]
x = 7
y = 5

[general]
live_config_reload = true


[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
