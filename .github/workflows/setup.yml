name: Dotfiles setup

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fresh-install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, arch]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: tests/container.sh "${{ matrix.distro }}"
