###configuration
set-option -g default-shell $SHELL
set-option -sa terminal-features ",xterm*:RGB"
set-option -g default-terminal "tmux-256color"

set-option -g automatic-rename on
set-option -g automatic-rename-format '[#{b:pane_current_command} >#{b:pane_current_path}]'

# increase scroll-back history
set -g history-limit 50000

# use vim key bindings
setw -g mode-keys vi

# decrease command delay (increases vim responsiveness)
set -sg escape-time 1

# increase repeat time for repeatable commands
set -g repeat-time 1000

# re-number windows when one is closed
set -g renumber-windows on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# Auto-clear @claude_notify when switching windows and force display refresh
set-hook -g after-select-window 'set-option -wu @claude_notify; refresh-client'

# Enable focus events for neovim FocusGained/FocusLost
set -g focus-events on


###########################
#  Key Bindings
###########################

# tmux prefix
unbind C-b
set -g prefix C-Space # Acts as Ctrl-<space>

# rebind splits to open with current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

## Join windows: <prefix> s, <prefix> j
bind-key          S choose-window "join-pane -v -s "%%""
bind-key          V choose-window "join-pane -h -s "%%""
bind-key          B "break-pane"

bind-key s choose-session "move-window -t %%:"

# Use Ctrl+Shift+(Left/Right) to move windows (tabs)
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf \; display 'Reloaded!'

# Enable screen-like C-a C-a moving to last window
bind-key C-a last-window

set -g mouse on

# Vim style
set -s copy-command "xclip -selection clipboard -in"
bind-key p run-shell "xclip -selection clipboard -out | tmux load-buffer - && tmux paste-buffer"
bind-key -T copy-mode-vi "y" send-keys -X copy-pipe-and-cancel

#smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' 2>/dev/null | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys Escape '[104;5u'" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"

# Go to beginning of line
bind a send-prefix

###########################
# Status Bar
###########################

# set refresh interval for status bar
set -g status-interval 1
set -g status-justify left


###########################
# Colors
###########################

# color status bar
set -g status-fg white

# highlight current window
set-window-option -g window-status-current-style "bg=#722b67,fg=#fdfff1"

# set color of active pane
set -g pane-border-style fg="colour237"
set -g pane-active-border-style fg="colour117"
set -g status-bg "colour238"
set -g message-command-style "fg=colour249,bg=colour237"
set -g status-left-length "100"
set -g status "on"
set -g message-style "fg=colour249,bg=colour237"
set -g status-right-length "100"
setw -g window-status-style "fg=colour117,bg=colour238"
setw -g window-status-separator ""

set -g status-left '#{?window_zoomed_flag,#[bg=red] ZOOMED ,}#[default]'
set -g status-right '%m-%d-%Y %H:%M:%S'
setw -g window-status-format "#{?@claude_notify,#[fg=black]#[bg=yellow]#[bold],} #I #W #{?@claude_notify,#[default],}"
setw -g window-status-current-format "#{?@claude_notify,#[fg=black]#[bg=yellow]#[bold],} #I #W #{?@claude_notify,#[default],}"
